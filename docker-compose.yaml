networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-google_key.json}
      GOOGLE_PATH_ZOOMER: ${GOOGLE_PATH_ZOOMER:-}
      GOOGLE_PATH_OPEN21: ${GOOGLE_PATH_OPEN21:-}
      GOOGLE_PATH_FRIENDS: ${GOOGLE_PATH_FRIENDS:-}
      GOOGLE_PATH_SOCIAL: ${GOOGLE_PATH_SOCIAL:-}
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - ./scripts/:/app/scripts
      # корень репозитория на хосте: /app/repo/ (rw — импорт/экспорт xlsx)
      - .:/app/repo
    networks:
      - backend
    ports:
      - "${API_PORT}:${API_PORT}"
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port ${API_PORT}

  admin:
    build: .
    working_dir: /app/src
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONPATH: /app/src
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit
    networks:
      - backend
    ports:
      - "${ADMIN_PORT:-8501}:8501"
    command: uv run streamlit run admin/Home.py --server.port 8501 --server.address 0.0.0.0
